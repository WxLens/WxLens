name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Originally written by mirroring external/legacy-supercell-wx/.github/workflows/ci.yml's proven
# pattern; green on GitHub Actions since 2026-09-05.
#
# This job now covers Windows only. Linux and macOS build, test and package through the reusable
# linux.yml and macos.yml workflows called at the bottom of this file, so each platform's CI steps
# and its release-packaging steps are the same steps.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows_vs2026_x64
            os: windows-2025-vs2026
            build_type: Release
            # TEMPORARY: pinned one minor version behind local dev (6.11.1, which linux.yml
            # still uses) because Qt's own windows_x86/desktop package index for the entire 6.11.x
            # line (.0/.1/.2 all checked) currently fails aqtinstall's checksum fetch - confirmed
            # from an unrelated machine/network, so it's an upstream Qt outage, not this repo, CI,
            # or the retry logic above. linux_gcc_64/6.11.1 is unaffected. Verified 6.10.0 resolves
            # cleanly for win64_msvc2022_64. Revert to 6.11.1 once Qt's index is fixed.
            qt_version: 6.10.0
            qt_arch_aqt: win64_msvc2022_64
            qt_arch_dir: msvc2022_64
            conan_profile: wxlens-windows_vs2026_x64
            artifact_suffix: windows-vs2026-x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # Without this, cl.exe/link.exe are never on PATH for later steps and CMake silently falls
      # back to whatever C++ compiler IS on PATH - which, once a step's shell is bash (needed
      # below for the \-continuation syntax), is Git for Windows' own bundled MinGW64 at
      # C:\mingw64\bin. That compiles the whole project without complaint (it's portable C++) but
      # fails at the first link against Qt's MSVC-built import libraries ("undefined reference to
      # __imp__ZN7QObject...") - confirmed as the actual cause of a Build-step failure after
      # everything upstream (submodules, Qt, Conan, CMake configure) had already gone green.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Only the submodules WxLens actually builds are initialized - see
      # docs/adr/0002-wxdata-reuse-strategy.md and docs/adr/0004-maplibre-qml-integration.md for
      # why these are the ones needed (and why the rest of external/legacy-supercell-wx's own
      # nested submodules are deliberately skipped).
      - name: Initialize required submodules
        shell: bash
        run: |
          # maplibre-native's own vendored tree (below) includes wagyu's test fixtures, whose
          # generated geojson filenames comfortably exceed Windows' 260-char MAX_PATH once
          # combined with the runner's checkout path - "Filename too long" mid-clone. This dev
          # machine has never hit it because core.longpaths is already true here; GitHub's
          # Windows runners default it off. A no-op on Linux/macOS.
          git config --global core.longpaths true
          git submodule update --init --depth 1 -- \
            external/legacy-supercell-wx \
            external/aws-sdk-cpp \
            external/date \
            external/units \
            external/hsluv-c \
            external/maplibre-native-qt \
            external/cmake-conan
          # aws-sdk-cpp's crt/aws-crt-cpp is itself a submodule with its own nested submodules
          # (aws-c-common, aws-c-io, ...) - a non-recursive init leaves those empty/stale and
          # aws-crt-cpp's own EnforceSubmoduleVersions check fails. See AGENTS.md's "External
          # dependencies" section: these trees are "sometimes multiply-nested" and every level
          # needs initializing, not just the top one.
          git -C external/aws-sdk-cpp submodule update --init --recursive --depth 1
          # maplibre-native itself vendors further submodules (e.g. maplibre-native-base/deps/
          # cheap-ruler-cpp) - same multiply-nested situation as aws-sdk-cpp above.
          git -C external/maplibre-native-qt submodule update --init --recursive --depth 1 -- vendor/maplibre-native
          git -C external/legacy-supercell-wx submodule update --init --depth 1 -- test/data

      # aqtinstall's checksum fetch for Updates.xml against download.qt.io is observed to fail
      # intermittently and independently of this repo or GitHub Actions (reproduced the identical
      # "Failed to download checksum for the file 'Updates.xml'" error querying aqt directly from
      # an unrelated machine/network for multiple Qt versions) - retry rather than treat one CDN
      # hiccup as a build failure.
      - name: Install Qt (attempt 1)
        id: qt1
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch_aqt }}
          modules: 'qtshadertools'

      - name: Wait before retrying Qt install
        if: steps.qt1.outcome == 'failure'
        run: sleep 30
        shell: bash

      - name: Install Qt (attempt 2)
        id: qt2
        if: steps.qt1.outcome == 'failure'
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch_aqt }}
          modules: 'qtshadertools'

      - name: Wait before retrying Qt install again
        if: steps.qt1.outcome == 'failure' && steps.qt2.outcome == 'failure'
        run: sleep 60
        shell: bash

      - name: Install Qt (attempt 3)
        if: steps.qt1.outcome == 'failure' && steps.qt2.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch_aqt }}
          modules: 'qtshadertools'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan
        run: pip install conan

      - name: Install Conan profile
        run: conan config install ./tools/conan/profiles/${{ matrix.conan_profile }} -tf profiles

      - name: Conan install
        shell: bash
        run: |
          conan install . --remote conancenter --build missing \
            --profile:all ${{ matrix.conan_profile }} \
            --settings:all build_type=${{ matrix.build_type }} \
            --output-folder build/conan

      - name: CMake configure
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}/../.." \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=external/cmake-conan/conan_provider.cmake \
            -DCONAN_HOST_PROFILE=${{ matrix.conan_profile }} \
            -DCONAN_BUILD_PROFILE=${{ matrix.conan_profile }}

      - name: Build
        run: cmake --build build --target wxlens-app wxlens-wxdata-test wxlens-app-test wxlens-qml-test

      # -L selects by label, not -R by name: gtest_discover_tests registers each case under its
      # GoogleTest name, so the previous `-R wxlens-wxdata-test` matched nothing and, without
      # --no-tests=error, exited 0. This step reported success while running zero tests.
      # --no-tests=error makes that failure mode impossible to repeat. The `wxlens` label covers
      # the wxdata, app and QML suites and excludes the vendored MapLibre test target.
      # The QML suite runs headless - the target carries QT_QPA_PLATFORM=offscreen and the Qt
      # plugin/library paths as CTest properties, so no display setup is needed here.
      # Two exclusions, both for the same reason: they reach the public internet and hard-fail
      # when it does not answer, instead of skipping themselves the way wxdata's other
      # network-dependent tests do. Both live in external/, which is read-only here, so the fix
      # belongs upstream rather than in a local edit.
      #   IemApiProviderTest - drives a live third-party API (mesonet.agron.iastate.edu).
      #   NtpClient.Poll     - polls public NTP servers over UDP/123, which GitHub's macOS
      #                        runners block; it passes on Linux and Windows, so excluding it
      #                        everywhere keeps one filter rather than a per-platform one.
      # Both still run in a normal local `ctest` without -E. Drop each once it skips like its
      # neighbours upstream.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error -L wxlens -E 'IemApiProviderTest|NtpClient\.Poll'

  linux:
    uses: ./.github/workflows/linux.yml

  macos:
    uses: ./.github/workflows/macos.yml
