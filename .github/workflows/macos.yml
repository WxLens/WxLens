name: macOS packages

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (defaults to the version in CMakeLists.txt)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: false
      # A backfill dispatch that omits build_ref checks out the tag itself - and any tag older
      # than this packaging predates these scripts entirely, so the job spends the better part of
      # an hour building before dying at the package step with an error that says nothing about
      # the real cause. Catch it in seconds instead. (Observed: release.yml dispatched with
      # tag=v0.1.0 and no build_ref checked out v0.1.0's commit, which has no tools/installer/ at
      # all; all three package jobs failed that way.)
      - name: Verify the checked-out ref has the packaging scripts
        run: |
          if [[ ! -f "tools/installer/macos/package.sh" ]]; then
            echo "::error::tools/installer/macos/package.sh is missing from the checked-out ref ($(git rev-parse --short HEAD))."
            echo "::error::Backfilling a tag older than the packaging? Re-run release.yml with build_ref set to a commit that has these scripts, e.g. main."
            exit 1
          fi

      - name: Initialize required submodules
        run: |
          git submodule update --init --depth 1 -- \
            external/legacy-supercell-wx external/aws-sdk-cpp external/date \
            external/units external/hsluv-c external/maplibre-native-qt external/cmake-conan
          git -C external/aws-sdk-cpp submodule update --init --recursive --depth 1
          git -C external/maplibre-native-qt submodule update --init --recursive --depth 1 -- vendor/maplibre-native
          git -C external/legacy-supercell-wx submodule update --init --depth 1 -- test/data
      # Apple Clang, not Homebrew's llvm@18. wxdata compiles its parallel algorithms with
      # -fexperimental-library and links -lc++experimental (external/.../wxdata.cmake's LIBCPP
      # block), and those two have to come from the same libc++. Building with Homebrew LLVM 18's
      # headers while the linker resolved -lc++experimental from the macOS SDK left every
      # std::__par_backend::__libdispatch symbol undefined - a link failure with no compile error
      # anywhere before it. The upstream Supercell Wx macOS jobs build with plain clang/clang++ for
      # the same reason, and it keeps the shipped binary free of Homebrew paths, which
      # tools/installer/macos/package.sh rejects outright.
      - name: Install build tools
        run: brew install ninja

      # Intel only. /usr/local is Homebrew's prefix on Intel Macs and is on Clang's default
      # include path, so Homebrew's libzip headers shadow the Conan libzip this build passes with
      # -isystem: wxdata's zip_stream_reader.cpp compiled against /usr/local/include/zip.h and
      # died on -Werror,-Wnullability-extension. Apple Silicon never hits this because its
      # Homebrew prefix, /opt/homebrew, is not searched by default - which is exactly why the
      # arm64 job is green and this one was not. Removing the shadowing headers makes the Conan
      # copy win, which is the one the rest of the build links against.
      - name: Remove Homebrew headers that shadow Conan's
        if: matrix.arch == 'x64'
        run: sudo rm -f /usr/local/include/zip.h /usr/local/include/zipconf.h
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Conan
        run: pip install conan
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          arch: clang_64
          modules: qtshadertools
      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: macos-${{ matrix.arch }}-conan-${{ hashFiles('conanfile.py', 'tools/conan/profiles/wxlens-macos*') }}
      - name: Install dependencies
        env:
          PROFILE: wxlens-macos_clang-18_${{ matrix.arch }}
        run: |
          conan config install "./tools/conan/profiles/$PROFILE" -tf profiles
          conan install . --remote conancenter --build missing \
            --profile:all "$PROFILE" --output-folder build/conan
      - name: Save Conan packages
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Configure
        env:
          PROFILE: wxlens-macos_clang-18_${{ matrix.arch }}
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=external/cmake-conan/conan_provider.cmake \
            -DCONAN_HOST_PROFILE="$PROFILE" -DCONAN_BUILD_PROFILE="$PROFILE"
      - name: Build and test
        run: |
          cmake --build build --target wxlens-app wxlens-wxdata-test
          ctest --test-dir build --output-on-failure -R wxlens-wxdata-test
      - name: Package disk image
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          if [[ -z "$PACKAGE_VERSION" ]]; then
            PACKAGE_VERSION=$(sed -n 's/^set(WXLENS_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)
          fi
          bash tools/installer/macos/package.sh build "$PACKAGE_VERSION" "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
